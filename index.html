<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oogway · PSX financial intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Funnel+Display:wght@400;500;600;700&display=swap" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
/* === Oogway — Swiss-minimal fintech === */

:root {
  /* Defaults — overridden by palette tweak */
  --bg:        #F6F4EF;
  --bg-elev:  #FFFFFF;
  --bg-deep:  #0B0B0C;
  --ink:      #0B0B0C;
  --ink-2:    #2A2A2D;
  --ink-3:    #5C5C61;
  --ink-4:    #8C8C93;
  --rule:     rgba(11,11,12,0.08);
  --rule-2:   rgba(11,11,12,0.14);
  --accent:   #0E7B5E;
  --accent-soft: rgba(14,123,94,0.08);
  --pos:      #0E7B5E;
  --neg:      #B6422A;
  --warn:     #B07B1F;
  --on-dark:  #F4F1EA;
  --on-dark-2:#A8A59D;

  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-display: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --display-track: -0.035em;
  --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --container: 1240px;
  --pad-x: clamp(20px, 4vw, 56px);
  --section-y: clamp(72px, 9vw, 128px);

  --radius-sm: 8px;
  --radius:    14px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  font-feature-settings: "ss01", "ss02", "cv11";
  font-variant-numeric: tabular-nums;
}

img, svg { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }

.mono { font-family: var(--font-mono); font-feature-settings: "ss01", "cv11"; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 8px; vertical-align: middle;
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 var(--pad-x);
}

/* === NAV === */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { height: 26px; width: auto; display: block; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--ink);
  display: grid; place-items: center;
  color: var(--bg);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.02em;
}
.brand-name { font-weight: 500; letter-spacing: -0.01em; font-size: 15px; }
.brand-name .sup {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  margin-left: 6px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  vertical-align: 2px;
}
.nav-links { display: flex; gap: 28px; }
.nav-link {
  font-size: 13.5px; color: var(--ink-2);
  transition: color 0.15s;
}
.nav-link:hover { color: var(--ink); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.api-pill {
  display: inline-flex; align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  border: 1px solid var(--rule-2);
  border-radius: 999px;
  padding: 5px 10px 5px 8px;
}
.api-pill .pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  margin-right: 7px;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
  50%      { box-shadow: 0 0 0 5px transparent; }
}

/* === BUTTONS === */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid transparent;
  transition: transform 0.12s ease, background 0.18s, color 0.18s, border-color 0.18s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover {
  background: color-mix(in oklab, var(--ink) 86%, var(--bg) 14%);
  color: var(--bg);
}
.btn-ghost { color: var(--ink); border-color: var(--rule-2); background: transparent; }
.btn-ghost:hover { background: color-mix(in oklab, var(--ink) 4%, transparent); }
.btn-sm { height: 30px; padding: 0 12px; font-size: 12.5px; gap: 6px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; }
.btn-arrow { width: 14px; height: 14px; }

/* === TICKER === */
.ticker {
  border-bottom: 1px solid var(--rule);
  overflow: hidden;
  background: var(--bg);
}
.ticker-track {
  display: flex; gap: 48px;
  white-space: nowrap;
  padding: 12px 0;
  animation: marquee 60s linear infinite;
  width: max-content;
}
.ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.ticker-item {
  display: inline-flex; align-items: baseline; gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-2);
}
.ticker-item .t { font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }
.ticker-item .p { color: var(--ink-2); }
.ticker-item .c { color: var(--accent); font-size: 11px; }
.ticker-item .c.neg { color: var(--neg); }

/* === HERO === */
.hero { padding-top: clamp(60px, 8vw, 110px); padding-bottom: clamp(40px, 5vw, 64px); }
.hero-eyebrow { display: inline-flex; align-items: center; margin-bottom: 28px; }
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(40px, 6.8vw, 88px);
  line-height: 0.98;
  letter-spacing: var(--display-track);
  font-weight: 500;
  margin: 0 0 28px;
  max-width: 18ch;
  text-wrap: balance;
}
.hero h1 .accent {
  color: var(--accent);
  font-weight: 500;
}
.hero p.lede {
  font-size: clamp(16px, 1.4vw, 19px);
  line-height: 1.55;
  color: var(--ink-2);
  max-width: 52ch;
  margin: 0 0 36px;
  text-wrap: pretty;
}
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }

/* Centered, headline-led hero — selector lives below */
.hero.hero-center { padding-top: clamp(64px, 9vw, 132px); padding-bottom: clamp(56px, 7vw, 96px); }
.hero-statement {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.hero-statement .hero-eyebrow { margin-bottom: 32px; }
.hero-statement h1 {
  font-size: clamp(44px, 8.4vw, 128px);
  line-height: 0.96;
  letter-spacing: var(--display-track);
  font-weight: 500;
  margin: 0 0 28px;
  max-width: 22ch;
  text-wrap: balance;
}
.hero-statement p.lede {
  font-size: clamp(16px, 1.4vw, 20px);
  color: var(--ink-2);
  max-width: 58ch;
  margin: 0 0 36px;
  text-wrap: pretty;
}
.hero-statement .hero-cta { justify-content: center; }
.hero-selector-wrap {
  margin-top: clamp(40px, 5vw, 72px);
  display: flex;
  justify-content: center;
}
.hero-selector-wrap .hero-card {
  width: 100%;
  max-width: 560px;
}

/* hero data card on right */
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: clamp(28px, 5vw, 88px);
  align-items: end;
}
@media (max-width: 920px) { .hero-grid { grid-template-columns: 1fr; } }

.hero-card {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: 0 1px 0 rgba(11,11,12,0.02), 0 14px 40px -24px rgba(11,11,12,0.18);
}
.hero-card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--rule);
  margin-bottom: 16px;
}
.hero-card-head .lab { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; }
.hero-card-head .live { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.hero-card-head .live::before { content: ""; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; margin-right: 6px; }

.selector {
  display: grid; grid-template-columns: 1fr; gap: 12px;
}
.selector-row {
  display: flex; align-items: center;
  border: 1px solid var(--rule-2);
  border-radius: 12px;
  padding: 12px 14px;
  background: var(--bg);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  gap: 14px;
}
.selector-row:hover { border-color: var(--ink-3); }
.selector-row.active {
  border-color: var(--ink);
  background: var(--bg-elev);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--ink) 6%, transparent);
}
.selector-ticker { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink); min-width: 56px; }
.selector-name { font-size: 13px; color: var(--ink-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selector-price { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }
.selector-change { font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-left: 8px; }
.selector-change.neg { color: var(--neg); }

.hero-pick {
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.hero-pick-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.hero-pick-meta .nm { font-size: 14px; font-weight: 500; }
.hero-pick-meta .sec { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em; }
.hero-pick-numbers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.hero-pick-numbers .lab { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.hero-pick-numbers .val { font-family: var(--font-mono); font-size: 16px; color: var(--ink); letter-spacing: -0.01em; }
.hero-pick-numbers .val .pos { color: var(--accent); font-size: 12px; margin-left: 2px; }
.hero-pick-numbers .val .neg { color: var(--neg); font-size: 12px; margin-left: 2px; }

.hero-pick .btn { width: 100%; justify-content: center; }

.dropdown { position: relative; }
.dropdown-trigger {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--rule-2);
  border-radius: 12px;
  background: var(--bg);
}
.dropdown-trigger:hover { border-color: var(--ink-3); }
.dropdown-trigger .lf { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.dropdown-trigger .lf .t { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.dropdown-trigger .lf .n { font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dropdown-trigger .chev { width: 14px; height: 14px; color: var(--ink-3); transition: transform 0.18s; }
.dropdown.open .chev { transform: rotate(180deg); }
.dropdown-menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg-elev);
  border: 1px solid var(--rule-2);
  border-radius: 12px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  max-height: 340px;
  box-shadow: 0 16px 40px -16px rgba(11,11,12,0.22);
  z-index: 5;
}
.dropdown-search { padding: 2px 4px 8px; }
.dropdown-search input {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--rule-2);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.dropdown-search input:focus { border-color: var(--ink-3); }
.dropdown-list { overflow-y: auto; }
.dropdown-empty { padding: 16px 12px; font-size: 13px; color: var(--ink-3); text-align: center; }
.dropdown-item {
  display: flex; align-items: baseline; gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--ink-2);
}
.dropdown-item:hover { background: color-mix(in oklab, var(--ink) 5%, transparent); color: var(--ink); }
.dropdown-item .t { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink); min-width: 52px; }
.dropdown-item .p { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }

/* === STATS STRIP === */
.stats {
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: clamp(40px, 6vw, 80px);
}
.stat {
  padding: 36px var(--pad-x);
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 10px;
}
.stat:last-child { border-right: 0; }
.stat .val {
  font-size: clamp(40px, 4.5vw, 64px);
  letter-spacing: -0.04em;
  font-weight: 400;
  line-height: 1;
}
.stat .val.mono { font-family: var(--font-mono); font-weight: 500; }
.stat .lab { font-size: 13px; color: var(--ink-3); max-width: 22ch; line-height: 1.4; }
@media (max-width: 800px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--rule); }
}

/* === SECTIONS === */
section { padding: var(--section-y) 0; }
.section-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 56px; max-width: 720px; }
.section-head h2 {
  font-family: var(--font-display);
  font-size: clamp(32px, 4.2vw, 52px);
  line-height: 1.02;
  letter-spacing: var(--display-track);
  font-weight: 500;
  margin: 0;
  text-wrap: balance;
}
.section-head h2 .accent { color: var(--accent); }
.section-head p { font-size: 17px; color: var(--ink-2); margin: 0; max-width: 56ch; text-wrap: pretty; }

/* HOW IT WORKS */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius-lg); overflow: hidden; }
.step {
  background: var(--bg-elev);
  padding: 32px;
  display: flex; flex-direction: column; gap: 18px;
  min-height: 240px;
}
.step .num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.14em; }
.step h3 { font-family: var(--font-display); font-size: 22px; line-height: 1.15; letter-spacing: var(--display-track); font-weight: 500; margin: 0; }
.step p { font-size: 14.5px; color: var(--ink-3); margin: 0; line-height: 1.55; }
.step .icon {
  width: 36px; height: 36px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  display: grid; place-items: center;
  color: var(--ink-2);
  margin-bottom: -2px;
}
@media (max-width: 800px) { .steps { grid-template-columns: 1fr; } }

/* COVERAGE TABLE */
.coverage-card {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.table { width: 100%; border-collapse: collapse; }
.table th {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: left;
  font-weight: 500;
  padding: 16px 24px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
}
.table th.r { text-align: right; }
.table td {
  padding: 18px 24px;
  border-bottom: 1px solid var(--rule);
  font-size: 14px;
  vertical-align: middle;
}
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr {
  cursor: pointer;
  transition: background 0.12s;
}
.table tbody tr:hover { background: color-mix(in oklab, var(--ink) 3%, transparent); }
.table .co .co-t { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink); display: inline-block; min-width: 52px; }
.table .co .co-n { font-size: 14px; color: var(--ink); }
.table .sec { color: var(--ink-3); font-size: 13px; }
.table .price { text-align: right; font-family: var(--font-mono); font-size: 13.5px; color: var(--ink); }
.table .chg { text-align: right; font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); }
.table .chg.neg { color: var(--neg); }
.table .go { text-align: right; }
.table .go-arrow {
  width: 28px; height: 28px;
  border-radius: 999px;
  border: 1px solid var(--rule-2);
  display: inline-grid; place-items: center;
  color: var(--ink-2);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.table tbody tr:hover .go-arrow { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.coverage-foot {
  padding: 14px 24px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: center;
  background: var(--bg);
  border-top: 1px solid var(--rule);
}

/* === DARK CTA === */
.dark-cta {
  background: var(--bg-deep);
  color: var(--on-dark);
  position: relative;
  overflow: hidden;
}
.dark-cta::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(800px 400px at 20% 20%, color-mix(in oklab, var(--accent) 20%, transparent), transparent 60%),
              radial-gradient(900px 500px at 80% 80%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 60%);
  pointer-events: none;
}
.dark-cta-inner {
  padding: clamp(72px, 10vw, 140px) 0;
  position: relative;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: clamp(36px, 6vw, 96px);
  align-items: center;
}
@media (max-width: 800px) { .dark-cta-inner { grid-template-columns: 1fr; } }
.dark-cta h2 {
  font-family: var(--font-display);
  font-size: clamp(36px, 5.2vw, 68px);
  line-height: 1.0;
  letter-spacing: var(--display-track);
  font-weight: 500;
  margin: 0 0 22px;
  text-wrap: balance;
}
.dark-cta h2 .accent { color: var(--accent); font-weight: 500; }
.dark-cta p { color: var(--on-dark-2); font-size: 17px; max-width: 48ch; margin: 0 0 28px; }
.dark-cta .btn-primary { background: var(--on-dark); color: var(--bg-deep); }
.dark-cta .btn-primary:hover { background: #fff; }
.dark-cta .btn-ghost { color: var(--on-dark); border-color: rgba(255,255,255,0.18); }
.dark-cta .btn-ghost:hover { background: rgba(255,255,255,0.06); }

.dark-cta-stats {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.dark-cta-stat { background: var(--bg-deep); padding: 24px 22px; display: flex; flex-direction: column; gap: 8px; }
.dark-cta-stat .v { font-family: var(--font-mono); font-size: 28px; letter-spacing: -0.02em; }
.dark-cta-stat .v .ac { color: var(--accent); }
.dark-cta-stat .l { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-dark-2); }

/* === FOOTER === */
.footer {
  border-top: 1px solid var(--rule);
  padding: 28px 0;
  font-size: 12px;
  color: var(--ink-3);
}
.footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.footer .mono { font-size: 11px; letter-spacing: 0.04em; }

/* ============================== */
/* === ANALYSIS RESULTS VIEW  === */
/* ============================== */

.analysis-shell {
  animation: fadeUp 0.32s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.analysis-bar {
  border-bottom: 1px solid var(--rule);
  padding: 16px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.analysis-bar .left { display: flex; align-items: center; gap: 14px; }
.analysis-bar .back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--ink-2);
  padding: 6px 10px; border-radius: 8px;
}
.analysis-bar .back:hover { background: color-mix(in oklab, var(--ink) 5%, transparent); color: var(--ink); }
.analysis-bar .crumb {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}

.analysis-head {
  padding-top: clamp(36px, 5vw, 64px);
  padding-bottom: 36px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: clamp(28px, 5vw, 80px);
  align-items: end;
}
@media (max-width: 900px) { .analysis-head { grid-template-columns: 1fr; } }
.analysis-title { display: flex; flex-direction: column; gap: 20px; }
.analysis-title .badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  border: 1px solid var(--rule-2);
  border-radius: 999px;
  padding: 5px 10px;
}
.badge.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.analysis-title h1 {
  font-family: var(--font-display);
  font-size: clamp(40px, 5.4vw, 72px);
  line-height: 1.0;
  letter-spacing: var(--display-track);
  font-weight: 500;
  margin: 0;
}
.analysis-title h1 .sub { display: block; font-size: clamp(16px, 1.5vw, 20px); color: var(--ink-3); margin-top: 14px; font-weight: 400; letter-spacing: 0; }

.price-card {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: 22px;
}
.price-card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.price-card .top .lab { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; }
.price-card .top .live { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.price-card .top .live::before { content: ""; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; margin-right: 6px; }
.price-card .big { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.price-card .big .px { font-family: var(--font-mono); font-size: clamp(34px, 4vw, 48px); letter-spacing: -0.025em; }
.price-card .big .chg { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.price-card .big .chg.neg { color: var(--neg); }
.price-card .ohlc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.price-card .ohlc .lab { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.price-card .ohlc .val { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }

/* HEALTH SCORE */
.health-card {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: 32px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 36px;
  align-items: center;
}
@media (max-width: 700px) { .health-card { grid-template-columns: 1fr; text-align: left; } }
.health-dial {
  position: relative;
  width: 180px; height: 180px;
}
.health-dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.health-dial .track { fill: none; stroke: var(--rule-2); stroke-width: 8; }
.health-dial .fill { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(0.2,0.8,0.2,1); }
.health-dial .center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.health-dial .num {
  font-family: var(--font-mono);
  font-size: 56px;
  letter-spacing: -0.04em;
  font-weight: 500;
  line-height: 1;
}
.health-dial .lab {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 6px;
}
.health-meta .eyebrow { margin-bottom: 12px; }
.health-meta .h2 {
  font-family: var(--font-display);
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.1;
  letter-spacing: var(--display-track);
  font-weight: 500;
  margin: 0 0 12px;
}
.health-meta .desc { color: var(--ink-3); font-size: 14.5px; max-width: 60ch; line-height: 1.55; }

.scale {
  margin-top: 22px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(90deg, #B6422A 0%, #B6422A 25%, #B07B1F 25%, #B07B1F 50%, #6FA56C 50%, #6FA56C 75%, var(--accent) 75%, var(--accent) 100%);
  position: relative;
}
.scale .marker {
  position: absolute; top: -3px;
  width: 14px; height: 14px;
  background: var(--bg-elev);
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  transform: translateX(-50%);
  transition: left 0.8s cubic-bezier(0.2,0.8,0.2,1);
}
.scale-labels {
  display: flex; justify-content: space-between;
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* MODEL CARDS */
.models {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  margin-top: 28px;
}
@media (max-width: 900px) { .models { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .models { grid-template-columns: 1fr; } }
.model {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
}
.model .name { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.model .v {
  font-family: var(--font-mono);
  font-size: 34px;
  letter-spacing: -0.03em;
  font-weight: 500;
  line-height: 1;
}
.model .v.small { font-size: 22px; }
.model .pill {
  display: inline-flex; align-self: flex-start;
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}
.model .pill.neg { background: color-mix(in oklab, var(--neg) 12%, transparent); color: var(--neg); }
.model .pill.warn { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn); }
.model .desc { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }

/* FLAGS */
.flags { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
@media (max-width: 800px) { .flags { grid-template-columns: 1fr; } }
.flags-col {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 22px;
}
.flags-col h4 {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500; margin: 0 0 18px;
  display: flex; align-items: center; gap: 8px;
}
.flags-col h4 .dot-flag { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.flags-col.risks h4 .dot-flag { background: var(--neg); }
.flag-list { display: flex; flex-direction: column; gap: 14px; }
.flag {
  display: grid; grid-template-columns: 18px 1fr; gap: 12px;
  padding: 14px 14px 14px 12px;
  border: 1px solid var(--rule);
  border-radius: 10px;
}
.flag-mark { color: var(--accent); margin-top: 2px; }
.flags-col.risks .flag-mark { color: var(--neg); }
.flag .ttl { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.flag .body { font-size: 13px; color: var(--ink-3); line-height: 1.5; }

/* RATIO TABLE */
.ratios { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
@media (max-width: 800px) { .ratios { grid-template-columns: 1fr; } }
.ratio-group {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
}
.ratio-group h4 {
  margin: 0;
  padding: 14px 18px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.ratio-row {
  display: grid;
  grid-template-columns: 1fr auto auto 24px;
  align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule);
  font-size: 13.5px;
}
.ratio-row:last-child { border-bottom: 0; }
.ratio-row .nm { color: var(--ink); }
.ratio-row .bm { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }
.ratio-row .vl { font-family: var(--font-mono); font-size: 13px; color: var(--ink); text-align: right; min-width: 56px; }
.ratio-row .vl.pos { color: var(--accent); }
.ratio-row .vl.neg { color: var(--neg); }
.ratio-row .ok { width: 16px; height: 16px; display: grid; place-items: center; color: var(--accent); }
.ratio-row .ok.no { color: var(--neg); }

/* COMPARE VIEW */
.compare-head {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px;
  padding: clamp(28px, 4vw, 48px) 0;
}
@media (max-width: 700px) { .compare-head { grid-template-columns: 1fr; } }
.compare-side { display: flex; flex-direction: column; gap: 10px; }
.compare-side-lab {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}
.compare-vs {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  letter-spacing: 0.1em; color: var(--ink-3); padding-bottom: 14px;
}
@media (max-width: 700px) { .compare-vs { padding-bottom: 0; text-align: center; } }
.compare-table {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
}
.compare-table-head, .compare-table-row {
  display: grid; grid-template-columns: 1.4fr 1fr 1fr;
  gap: 12px; padding: 13px 18px; align-items: center;
}
.compare-table-head {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3); background: var(--bg); border-bottom: 1px solid var(--rule);
}
.compare-table-row { border-bottom: 1px solid var(--rule); font-size: 13.5px; }
.compare-table-row:last-child { border-bottom: 0; }
.compare-table-row .lab { color: var(--ink-2); }
.compare-table-row .val { font-family: var(--font-mono); font-size: 13.5px; color: var(--ink); }
.compare-table-row .val.win { color: var(--accent); font-weight: 600; }

/* PIOTROSKI CHECKLIST */
.piotroski-card {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 22px;
  margin-top: 28px;
}
.piotroski-card .head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule);
}
.piotroski-card .head .t { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.piotroski-card .head .score { font-family: var(--font-mono); font-size: 22px; letter-spacing: -0.02em; }
.piotroski-card .head .score .max { color: var(--ink-3); }
.checklist { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 24px; }
@media (max-width: 700px) { .checklist { grid-template-columns: 1fr; } }
.check {
  display: flex; align-items: center; gap: 10px;
  font-size: 13.5px;
  padding: 8px 0;
}
.check .mk {
  width: 18px; height: 18px; border-radius: 5px;
  display: grid; place-items: center; flex-shrink: 0;
  background: var(--accent-soft);
  color: var(--accent);
}
.check.no .mk { background: color-mix(in oklab, var(--neg) 10%, transparent); color: var(--neg); }
.check.no .nm { color: var(--ink-3); }

/* GRAHAM */
.graham {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 28px;
  margin-top: 28px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 36px;
  align-items: center;
}
@media (max-width: 800px) { .graham { grid-template-columns: 1fr; } }
.graham .left .eyebrow { margin-bottom: 14px; }
.graham .left h4 { font-family: var(--font-display); font-size: 22px; font-weight: 500; letter-spacing: var(--display-track); margin: 0 0 12px; line-height: 1.15; }
.graham .left p { font-size: 13.5px; color: var(--ink-3); line-height: 1.55; margin: 0 0 14px; }
.graham .formula {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 10px 14px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--bg);
  display: inline-block;
}
.graham .nums { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.graham .nums .cell { background: var(--bg-elev); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.graham .nums .lab { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.graham .nums .val { font-family: var(--font-mono); font-size: 22px; letter-spacing: -0.02em; }
.graham .nums .cell.hl .val { color: var(--accent); }
.graham .nums .cell.hl.neg .val { color: var(--neg); }

/* Section title within analysis */
.a-section { padding: clamp(40px, 5vw, 64px) 0; }
.a-section .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
.a-section .head h3 { font-family: var(--font-display); font-size: clamp(22px, 2.4vw, 28px); letter-spacing: var(--display-track); font-weight: 500; margin: 0; }
.a-section .head .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }

/* ── Article (lesson) view ──────────────────────────── */
.article-hero { padding: clamp(36px, 5vw, 56px) 0 8px; max-width: 760px; }
.article-hero .badges { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.article-hero .mono.article-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.article-hero h1 {
  font-family: var(--font-display);
  font-size: clamp(32px, 5vw, 48px);
  letter-spacing: var(--display-track);
  font-weight: 500;
  line-height: 1.08;
  margin: 0 0 16px;
}
.article-lede { font-size: 18px; color: var(--ink-2); line-height: 1.5; margin: 0; max-width: 60ch; }

.article-body { max-width: 720px; }
.article-body .a-section { padding: clamp(28px, 4vw, 40px) 0; border-top: 1px solid var(--rule); }
.article-body .a-section:first-child { border-top: none; padding-top: clamp(16px, 3vw, 24px); }
.article-body .a-section .head { margin-bottom: 14px; }
.article-body p {
  font-size: 15.5px;
  color: var(--ink-2);
  line-height: 1.7;
  margin: 0 0 14px;
}
.article-body p:last-child { margin-bottom: 0; }

.candle-diagram-wrap {
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 24px;
}
.candle-diagram { width: 100%; height: auto; display: block; }
.candle-diagram .cd-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--ink-3); }
.candle-diagram .cd-caption { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; fill: var(--ink-2); }

.video-card {
  display: flex; align-items: center; gap: 16px;
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: border-color 0.18s, background 0.18s;
}
.video-card:hover { border-color: var(--rule-2); background: color-mix(in oklab, var(--bg-elev) 88%, var(--accent) 6%); }
.video-card-icon {
  width: 40px; height: 40px; flex: none;
  border-radius: 10px;
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
}
.video-card-body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.video-card-title { font-size: 14.5px; font-weight: 500; color: var(--ink); }
.video-card-channel { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); }
.video-card-note { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; margin-top: 4px; }
.video-card-arrow { width: 16px; height: 16px; flex: none; color: var(--ink-3); }

.analysis-foot {
  border-top: 1px solid var(--rule);
  padding: 32px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  margin-top: 24px;
}

/* ============================== */
/* === NEW SECTIONS           === */
/* ============================== */

/* Pill badges (shared) */
.pill-badge {
  display: inline-flex; align-items: center;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid currentColor;
  color: var(--accent);
  background: transparent;
  white-space: nowrap;
}
.pill-badge.free { color: var(--accent); }
.pill-badge.pro  { color: var(--accent); }
.pill-badge.muted { color: var(--ink-3); }
.pill-badge.lvl-1 { color: var(--accent); }
.pill-badge.lvl-2 { color: var(--ink-2); }
.pill-badge.lvl-3 { color: var(--neg); }

/* ── Features grid ───────────────────────────────────── */
.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 960px) { .features-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .features-grid { grid-template-columns: 1fr; } }

.feature {
  position: relative;
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  text-align: left;
  transition: transform 0.2s, border-color 0.2s, background 0.2s;
}
button.feature { cursor: pointer; }
.feature:hover {
  transform: translateY(-2px);
  border-color: var(--rule-2);
  background: color-mix(in oklab, var(--bg-elev) 88%, var(--accent) 6%);
}
.feature h3 {
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.2;
  letter-spacing: var(--display-track);
  font-weight: 500;
  margin: 4px 0 0;
}
.feature p {
  font-size: 14px;

  <script>
// PSX universe — companies confirmed working end-to-end (analysis + live price).
// This seed list only renders before /api/companies/ responds (see below,
// which overwrites name/sector for every ticker so this never goes stale).
window.PSX_COMPANIES = [
  { ticker: "PSO",    name: "Pakistan State Oil",              sector: "Energy / OMC",  price: 0, change: 0, changePct: 0 },
  { ticker: "OGDC",   name: "Oil & Gas Development Co.",       sector: "Energy",        price: 0, change: 0, changePct: 0 },
  { ticker: "LUCK",   name: "Lucky Cement",                    sector: "Cement",        price: 0, change: 0, changePct: 0 },
  { ticker: "HBL",    name: "Habib Bank Limited",              sector: "Banking",       price: 0, change: 0, changePct: 0 },
  { ticker: "MCB",    name: "MCB Bank",                        sector: "Banking",       price: 0, change: 0, changePct: 0 },
  { ticker: "MEBL",   name: "Meezan Bank",                     sector: "Banking",       price: 0, change: 0, changePct: 0 },
  { ticker: "SYS",    name: "Systems Limited",                 sector: "Technology",    price: 0, change: 0, changePct: 0 },
  { ticker: "NESTLE", name: "Nestle Pakistan",                 sector: "Food & Consumer", price: 0, change: 0, changePct: 0 },
  { ticker: "SEARL",  name: "The Searle Company",              sector: "Pharmaceuticals", price: 0, change: 0, changePct: 0 },
];

// Pre-baked analysis for each ticker. Realistic-ish Phase 1 numbers.
window.PSX_ANALYSIS = {}
window.PSX_TICKER = window.PSX_COMPANIES.map(c => ({ ticker: c.ticker, price: c.price, changePct: c.changePct }));

window.OOGWAY_API = 'https://oogway-production-38dc.up.railway.app';

// Step 1: Sync company list against the backend (name/sector always win —
// this used to only ADD unseen tickers, which left the 9 seeded above
// permanently stuck on old labels even after the backend's data changed),
// THEN fetch all prices in sequence
fetch(window.OOGWAY_API + '/api/companies/')
  .then(r => r.json())
  .then(companies => {
    companies.forEach(c => {
      const existing = window.PSX_COMPANIES.find(x => x.ticker === c.ticker);
      if (existing) {
        existing.name = c.name;
        existing.sector = c.sector;
      } else {
        window.PSX_COMPANIES.push({ ticker: c.ticker, name: c.name, sector: c.sector, price: 0, change: 0, changePct: 0 });
      }
    });
    window.dispatchEvent(new Event('psx-prices-updated'));
  })
  .catch(() => {})
  .finally(() => {
    // Step 2: Now fetch live prices for ALL companies (including newly added ones)
    const tickers = window.PSX_COMPANIES.map(c => c.ticker);
    const requests = tickers.map(t =>
      fetch(window.OOGWAY_API + '/api/prices/' + t + '/live')
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    );
    Promise.all(requests).then(results => {
      results.forEach((data, i) => {
        if (!data) return;
        const co = window.PSX_COMPANIES[i];
        if (!co) return;
        co.price     = data.price      || 0;
        co.change    = data.change     || 0;
        co.changePct = data.change_pct || 0;
      });
      window.PSX_TICKER = window.PSX_COMPANIES.map(c => ({
        ticker: c.ticker, price: c.price, changePct: c.changePct
      }));
      window.dispatchEvent(new Event('psx-prices-updated'));
    });
  });

// Adapter: converts Railway API response → PSX_ANALYSIS format the frontend expects
function adaptAnalysis(api) {
  const health = (api.health && typeof api.health === 'object') ? api.health.score : (api.health || 50);
  const verdict = (api.health && typeof api.health === 'object') ? api.health.verdict : (health >= 75 ? 'Excellent' : health >= 55 ? 'Healthy' : health >= 35 ? 'Moderate' : 'Critical');
  const zone = api.altman?.zone || 'unknown';
  const zoneLabel = zone === 'safe' ? 'Safe Zone' : zone === 'grey' ? 'Grey Zone' : zone === 'bank' ? 'N/A (Bank)' : zone === 'distress' ? 'Distress Zone' : 'Unknown';
  const pioScore = api.piotroski?.score || 0;
  const pioLabel = api.piotroski?.signal || (pioScore >= 7 ? 'Strong Buy' : pioScore >= 4 ? 'Hold' : 'Avoid');
  const crit = api.piotroski?.criteria || {};
  const gn = api.graham?.graham_number || null;
  const mp = api.live_price?.price || 0;
  let grahamVerdict = api.graham?.applicable === false ? 'Not applicable' : (!gn ? 'N/A' : mp < gn ? 'Undervalued' : mp < gn * 1.1 ? 'Fair value' : 'Overvalued');
  const r = api.ratios || {};
  const prof = r.profitability || {};
  const liq = r.liquidity || {};
  const lev = r.leverage || {};
  const val = r.valuation || {};
  const fmt = (v, suffix) => v != null ? (+v).toFixed(suffix === '%' ? 1 : 2) + (suffix || '') : 'N/A';
  const nm = prof.net_margin || 0;
  const positive = [], risk = [];
  if (zone === 'safe') positive.push(['Altman Z-Score in Safe Zone', `Score of ${api.altman?.score?.toFixed(2)} indicates low bankruptcy risk.`]);
  if (pioScore >= 7) positive.push([`Strong Piotroski score (${pioScore}/9)`, 'Most quality-of-earnings criteria pass.']);
  if (grahamVerdict === 'Undervalued') positive.push(['Trading below Graham Number', `PKR ${mp.toFixed(0)} vs intrinsic value PKR ${gn?.toFixed(0)}.`]);
  if ((prof.roe || 0) >= 15) positive.push([`ROE of ${fmt(prof.roe)}%`, 'Strong return on shareholder equity.']);
  if ((liq.current_ratio || 0) >= 1.5) positive.push([`Current ratio ${fmt(liq.current_ratio)}`, 'Healthy short-term liquidity.']);
  if (zone === 'distress') risk.push(['Altman Z-Score in Distress Zone', 'Elevated bankruptcy risk — monitor closely.']);
  if (zone === 'grey') risk.push(['Altman Z-Score in Grey Zone', 'Moderate financial risk — watch leverage.']);
  if (pioScore <= 3) risk.push([`Weak Piotroski score (${pioScore}/9)`, 'Several quality-of-earnings criteria fail.']);
  if (grahamVerdict === 'Overvalued') risk.push(['Trading above Graham Number', 'Market price above intrinsic value estimate.']);
  if ((lev.debt_to_equity || 0) > 2) risk.push([`Debt/Equity at ${fmt(lev.debt_to_equity)}`, 'High leverage increases financial risk.']);
  if (positive.length === 0) positive.push(['Full analysis available', 'Based on the latest reported PSX financial data.']);
  if (risk.length === 0) risk.push(['No major concerns identified', 'All key metrics within acceptable ranges.']);
  return {
    health, verdict,
    altman: { score: api.altman?.score, zone: zone.charAt(0).toUpperCase() + zone.slice(1), label: zoneLabel },
    piotroski: { score: pioScore, max: 9, label: pioLabel },
    graham: { eps: fmt(api.graham?.eps), bv: fmt(api.graham?.bvps), gn, market: mp, verdict: grahamVerdict },
    netMargin: { value: nm, benchmark: 5.0, label: nm > 15 ? 'Well above sector' : nm > 5 ? 'Above sector' : nm > 0 ? 'In line' : 'Below sector' },
    ratios: {
      Profitability: [["Net margin","≥ 5%",fmt(prof.net_margin,'%'),(prof.net_margin||0)>=5],["Gross margin","≥ 15%",fmt(prof.gross_margin,'%'),(prof.gross_margin||0)>=15],["ROE","≥ 12%",fmt(prof.roe,'%'),(prof.roe||0)>=12],["ROA","≥ 5%",fmt(prof.roa,'%'),(prof.roa||0)>=5]],
      Liquidity: [["Current ratio","≥ 1.5",fmt(liq.current_ratio),(liq.current_ratio||0)>=1.5],["Quick ratio","≥ 1.0",fmt(liq.quick_ratio),(liq.quick_ratio||0)>=1.0]],
      Leverage: [["Debt / Equity","≤ 1.5",fmt(lev.debt_to_equity),(lev.debt_to_equity||999)<=1.5],["Interest coverage","≥ 3.0",fmt(lev.interest_coverage),(lev.interest_coverage||0)>=3.0]],
      Valuation: [["P/E","≤ 15",val.pe!=null?val.pe.toFixed(1)+'×':'N/A',val.pe!=null&&val.pe>0&&val.pe<=15],["P/B","≤ 2.0",val.pb!=null?val.pb.toFixed(2)+'×':'N/A',val.pb!=null&&val.pb<=2.0]],
    },
    piotroskiChecks: [
      ["Positive net income",!!crit.positive_roa],["Positive operating cash flow",!!crit.positive_cfo],
      ["Rising ROA",!!crit.increasing_roa],["Cash flow > net income",!!crit.cfo_greater_than_ni],
      ["Decreasing leverage",!!crit.decreasing_leverage],["Increasing current ratio",!!crit.improving_current_ratio],
      ["No new share issuance",!!crit.no_dilution],["Rising gross margin",!!crit.improving_gross_margin],
      ["Rising asset turnover",!!crit.improving_asset_turnover],
    ],
    flags: { positive, risk },
    _raw: api,
  };
}

// Reusable Tweaks shell + form-control helpers.
//
// Owns the host protocol (listens for __activate_edit_mode / __deactivate_edit_mode,
// posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you

//

//     "fontSize": 16,
//     "density": "regular",
//     "dark": false
//   }/*EDITMODE-END*/;
//
class AnalysisBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(err) { return { error: err }; }
  componentDidCatch(err, info) { console.error('Analysis render error:', err, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',background:'var(--bg)'}}>
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12,padding:24}}>
            <div style={{fontSize:16,color:'var(--ink)',fontWeight:600}}>Something went wrong loading this analysis</div>
            <div style={{fontFamily:'monospace',fontSize:12,color:'var(--neg)',maxWidth:480,textAlign:'center',wordBreak:'break-all'}}>{this.state.error.message}</div>
            <button className="btn btn-primary" style={{marginTop:12}} onClick={this.props.onBack}>Go back home</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

const fmtPrice = (n) => {
  if (n == null) return "—";
  return n >= 1000 ? n.toLocaleString("en-US", { maximumFractionDigits: 0 }) : n.toFixed(2);
};
const fmtPct = (n) => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";

/* ------- Dropdown selector (used inside hero card variant) ------- */
function CompanyDropdown({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const ref = useRef(null);
  const inputRef = useRef(null);
  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  useEffect(() => {
    if (open) {
      setQuery("");
      requestAnimationFrame(() => inputRef.current && inputRef.current.focus());
    }
  }, [open]);
  const sel = PSX_COMPANIES.find(c => c.ticker === value) || PSX_COMPANIES[0];
  const q = query.trim().toLowerCase();
  const filtered = q
    ? PSX_COMPANIES.filter(c => c.ticker.toLowerCase().includes(q) || c.name.toLowerCase().includes(q))
    : PSX_COMPANIES;
  return (
    <div className={"dropdown" + (open ? " open" : "")} ref={ref}>
      <button className="dropdown-trigger" onClick={() => setOpen(o => !o)}>
        <span className="lf">
          <span className="t">{sel.ticker}</span>
          <span className="n">{sel.name}</span>
        </span>
        <Icon.chev className="chev" />
      </button>
      {open && (
        <div className="dropdown-menu">
          <div className="dropdown-search">
            <input
              ref={inputRef}
              type="text"
              placeholder="Search ticker or company…"
              value={query}
              onClick={(e) => e.stopPropagation()}
              onChange={(e) => setQuery(e.target.value)}
            />
          </div>
          <div className="dropdown-list">
            {filtered.length === 0 ? (
              <div className="dropdown-empty">No companies match &ldquo;{query}&rdquo;</div>
            ) : filtered.map(c => (
              <div key={c.ticker} className="dropdown-item" onClick={() => { onChange(c.ticker); setOpen(false); }}>
                <span className="t">{c.ticker}</span>
                <span className="n">{c.name}</span>
                <span className="p">{c.price ? fmtPrice(c.price) : "—"}</span>
              </div>

          </div>
        </div>
      )}
    </div>
  );
}

/* ------- Live charts deep-dive ------- */
function LiveCharts() {
  // Deterministic candle data — green/red bodies, varying wicks
  const candles = [
    [62,78,84,55,1],[71,64,76,58,0],[64,80,88,60,1],[80,76,86,68,0],
    [76,84,90,72,1],[84,82,90,74,0],[82,86,92,76,1],[86,82,90,76,0],
    [82,76,86,70,0],[76,84,90,72,1],[84,80,88,72,0],[80,86,92,76,1],
    [86,82,90,76,0],[82,84,90,76,1],
  ];
  const W = 380, H = 100, n = candles.length;
  const slot = W / n;
  const bodyW = slot * 0.55;
  return (
    <section id="charts" className="livecharts">
      <div className="container">
        <div className="livecharts-grid">
          <div>
            <span className="eyebrow"><span className="dot" />PSX live charts</span>
            <h2 className="lc-title">Real-time PSX data<br/>without the noise.</h2>
            <p className="lc-lede">Candlestick charts, volume bars, moving averages, and live price feeds for every company on the Pakistan Stock Exchange. Presented clearly, not cluttered.</p>
            <div className="lc-tags">
              <span className="pill-badge pro">Pro feature</span>
            </div>
            <ul className="lc-list">
              <li><span className="lc-check"><Icon.check style={{width:11,height:11}} /></span>Candlestick charts with volume indicators</li>
              <li><span className="lc-check"><Icon.check style={{width:11,height:11}} /></span>Historical data and trend analysis</li>
              <li><span className="lc-check"><Icon.check style={{width:11,height:11}} /></span>Moving averages and price alerts</li>
            </ul>
          </div>

          <div className="lc-card">
            <div className="lc-card-head">
              <span className="lc-card-co">PSO · Pakistan State Oil</span>
              <span className="pill-badge pro">Live in Phase 2</span>
            </div>
            <div className="lc-chart">
              <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="160" preserveAspectRatio="none" aria-hidden="true">
                {candles.map(([o, c, hi, lo, up], i) => {
                  const x = i * slot + slot/2;
                  const top = Math.min(o, c);
                  const bh = Math.abs(c - o);
                  const color = up ? "var(--pos)" : "var(--neg)";
                  return (
                    <g key={i} stroke={color} strokeWidth="1" fill={color}>
                      <line x1={x} x2={x} y1={H - hi} y2={H - lo} />
                      <rect x={x - bodyW/2} y={H - top - bh} width={bodyW} height={Math.max(bh, 2)} rx="1" />
                    </g>
                  );
                })}
                {/* baseline */}
                <line x1="0" x2={W} y1={H - 1} y2={H - 1} stroke="var(--rule)" strokeWidth="0.6" />
              </svg>
            </div>
            <div className="lc-card-foot">
              <div className="lc-card-foot-t">Unlock live charts with Pro</div>
              <div className="lc-card-foot-b">Real-time prices, candlesticks, and full historical data.</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

  }, [score]);
  const dash = C * (1 - animated / 100);
  const color = score >= 75 ? "var(--accent)" : score >= 50 ? "var(--warn)" : "var(--neg)";
  return (
    <div className="health-dial">
      <svg viewBox="0 0 180 180">
        <circle className="track" cx="90" cy="90" r={R} />
        <circle className="fill" cx="90" cy="90" r={R}
