/* ------- Comparative analysis (2 companies side by side) ------- */
const RATIO_LOWER_IS_BETTER = new Set(["Debt / Equity", "P/E", "P/B"]);
function ratioWinner(nm, vlA, vlB) {
  const nA = parseFloat(vlA), nB = parseFloat(vlB);
  if (!isFinite(nA) || !isFinite(nB) || nA === nB) return null;
  return RATIO_LOWER_IS_BETTER.has(nm) ? (nA < nB ? "A" : "B") : (nA > nB ? "A" : "B");
}
function numWinner(a, b, lowerIsBetter) {
  if (typeof a !== "number" || typeof b !== "number" || a === b) return null;
  return lowerIsBetter ? (a < b ? "A" : "B") : (a > b ? "A" : "B");
}

function Compare({ tickerA, tickerB, onChangeA, onChangeB, onBack, onNavLink, onAnalyse, onCompare }) {
  const [dataA, setDataA] = useStateA(PSX_ANALYSIS[tickerA] || null);
  const [dataB, setDataB] = useStateA(PSX_ANALYSIS[tickerB] || null);
  const [loadingA, setLoadingA] = useStateA(!PSX_ANALYSIS[tickerA]);
  const [loadingB, setLoadingB] = useStateA(!PSX_ANALYSIS[tickerB]);
  const [errA, setErrA] = useStateA(null);
  const [errB, setErrB] = useStateA(null);

  const load = (ticker, setData, setLoading, setErr) => {
    setErr(null);
    if (PSX_ANALYSIS[ticker]) { setData(PSX_ANALYSIS[ticker]); setLoading(false); return; }
    setLoading(true);
    fetch(window.OOGWAY_API + '/api/analysis/' + ticker)
      .then(r => { if (!r.ok) throw new Error('API returned ' + r.status); return r.json(); })
      .then(apiData => {
        const adapted = adaptAnalysis(apiData);
        window.PSX_ANALYSIS[ticker] = adapted;
        if (apiData.live_price?.price) {
          const co = window.PSX_COMPANIES.find(c => c.ticker === ticker);
          if (co) { co.price = apiData.live_price.price; co.change = apiData.live_price.change || 0; co.changePct = apiData.live_price.change_pct || 0; }
        }
        setData(adapted);
        setLoading(false);
      })
      .catch(err => { setErr(err.message || 'Failed to load'); setLoading(false); });
  };

  useEffectA(() => { load(tickerA, setDataA, setLoadingA, setErrA); }, [tickerA]);
  useEffectA(() => { load(tickerB, setDataB, setLoadingB, setErrB); }, [tickerB]);
  useEffectA(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, []);

  const coA = PSX_COMPANIES.find(c => c.ticker === tickerA);
  const coB = PSX_COMPANIES.find(c => c.ticker === tickerB);
  const loading = loadingA || loadingB;
  const ready = !loading && dataA && dataB && coA && coB && !errA && !errB;

  const keyRows = ready ? [
    ["Health score", dataA.health + "/100", dataB.health + "/100", numWinner(dataA.health, dataB.health)],
    ["Altman Z-Score",
      typeof dataA.altman.score === "number" ? dataA.altman.score.toFixed(2) : dataA.altman.label,
      typeof dataB.altman.score === "number" ? dataB.altman.score.toFixed(2) : dataB.altman.label,
      numWinner(typeof dataA.altman.score === "number" ? dataA.altman.score : null, typeof dataB.altman.score === "number" ? dataB.altman.score : null)],
    ["Piotroski F-Score", dataA.piotroski.score + "/9", dataB.piotroski.score + "/9", numWinner(dataA.piotroski.score, dataB.piotroski.score)],
    ["Net margin", dataA.netMargin.value + "%", dataB.netMargin.value + "%", numWinner(dataA.netMargin.value, dataB.netMargin.value)],
    ["Graham verdict", dataA.graham.verdict, dataB.graham.verdict, null],
    ["Live price", "PKR " + fmtPrice(coA.price || 0), "PKR " + fmtPrice(coB.price || 0), null],
    ["Today's change", fmtPct(coA.changePct || 0), fmtPct(coB.changePct || 0), null],
  ] : [];

  return (
    <div className="analysis-shell">
      <Nav onAnalyse={onAnalyse} onHome={onBack} onNavLink={onNavLink} onCompare={onCompare} />
      <div className="print-report-header"><img src="logo-transparent.png" alt="Oogway" /></div>

      <div className="container">
        <div className="analysis-bar no-print">
          <div className="left">
            <button className="back" onClick={onBack}>
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                <path d="M13 8H3M7 4L3 8l4 4" />
              </svg>
              Back to home
            </button>
            <span className="crumb">Compare · {tickerA} vs {tickerB}</span>
          </div>
          <div className="left">
            <button className="btn btn-ghost btn-sm" disabled={!ready} onClick={() => window.print()}>
              <Icon.download className="btn-arrow" style={{ width: 14, height: 14 }} />
              Download PDF
            </button>
          </div>
        </div>

        <div className="compare-head">
          <div className="compare-side">
            <span className="compare-side-lab">Company A</span>
            <CompanyDropdown value={tickerA} onChange={onChangeA} />
          </div>
          <div className="compare-vs">VS</div>
          <div className="compare-side">
            <span className="compare-side-lab">Company B</span>
            <CompanyDropdown value={tickerB} onChange={onChangeB} />
          </div>
        </div>

        {loading ? (
          <AnalysisLoading label={tickerA + " vs " + tickerB} />
        ) : (errA || errB || !dataA || !dataB) ? (
          <div style={{ padding: "60px 0", textAlign: "center", color: "var(--ink-3)", fontSize: 13 }}>
            Could not load one or both companies. {errA || errB}
          </div>
        ) : (
          <>
            <div className="a-section" style={{ paddingTop: 0 }}>
              <div className="head"><h3>Head to head</h3><span className="meta">Key metrics</span></div>
              <div className="compare-table">
                <div className="compare-table-head">
                  <span></span><span>{tickerA}</span><span>{tickerB}</span>
                </div>
                {keyRows.map(([label, vA, vB, winner], i) => (
                  <div className="compare-table-row" key={i}>
                    <span className="lab">{label}</span>
                    <span className={"val" + (winner === "A" ? " win" : "")}>{vA}</span>
                    <span className={"val" + (winner === "B" ? " win" : "")}>{vB}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="a-section">
              <div className="head"><h3>Ratio breakdown</h3><span className="meta">Grouped · side by side</span></div>
              <div style={{ display: "grid", gap: 16 }}>
                {Object.entries(dataA.ratios).map(([group, rowsA]) => {
                  const rowsB = dataB.ratios[group] || [];
                  return (
                    <div className="compare-table" key={group}>
                      <div className="compare-table-head">
                        <span>{group}</span><span>{tickerA}</span><span>{tickerB}</span>
                      </div>
                      {rowsA.map(([nm, bm, vlA], i) => {
                        const rowB = rowsB[i] || [];
                        const vlB = rowB[2];
                        const winner = ratioWinner(nm, vlA, vlB);
                        return (
                          <div className="compare-table-row" key={nm}>
                            <span className="lab">{nm} <span style={{ color: "var(--ink-3)", fontSize: 11 }}>({bm})</span></span>
                            <span className={"val" + (winner === "A" ? " win" : "")}>{vlA}</span>
                            <span className={"val" + (winner === "B" ? " win" : "")}>{vlB}</span>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>

          </>
        )}
      </div>

      <Footer />
    </div>
  );
}

Object.assign(window, { Analysis, adaptAnalysis, Compare, AnalysisLoading });

  </script>

  <script type="text/babel">
/* === Oogway main app === */
/* Globals: React, ReactDOM, Landing, Analysis, useTweaks, TweaksPanel, TweakRadio, TweakColor, TweakSection */

const { useState: useStateApp, useEffect: useEffectApp } = React;

const PALETTES = {
  Ink: {
    "--bg": "#F6F4EF",
    "--bg-elev": "#FFFFFF",
    "--bg-deep": "#0B0B0C",
    "--ink": "#0B0B0C",
    "--ink-2": "#2A2A2D",
    "--ink-3": "#5C5C61",
    "--ink-4": "#8C8C93",
    "--rule": "rgba(11,11,12,0.08)",
    "--rule-2": "rgba(11,11,12,0.14)",
    "--accent": "#0E7B5E",
    "--accent-soft": "rgba(14,123,94,0.10)",
    "--neg": "#B6422A",
    "--on-dark": "#F4F1EA",
    "--on-dark-2": "#A8A59D",
  },
  Frost: {
    "--bg": "#F3F4F6",
    "--bg-elev": "#FFFFFF",
    "--bg-deep": "#0B1228",
    "--ink": "#0B1228",
    "--ink-2": "#1F263C",
    "--ink-3": "#5A6178",
    "--ink-4": "#8A91A4",
    "--rule": "rgba(11,18,40,0.08)",
    "--rule-2": "rgba(11,18,40,0.14)",
    "--accent": "#2A44E0",
    "--accent-soft": "rgba(42,68,224,0.10)",
    "--neg": "#C53636",
    "--on-dark": "#F0F2F8",
    "--on-dark-2": "#9CA3B5",
  },
  Paper: {
    "--bg": "#F0EBE0",
    "--bg-elev": "#FAF6EC",
    "--bg-deep": "#181613",
    "--ink": "#181613",
    "--ink-2": "#33302A",
    "--ink-3": "#6A6358",
    "--ink-4": "#94897A",
    "--rule": "rgba(24,22,19,0.10)",
    "--rule-2": "rgba(24,22,19,0.16)",
    "--accent": "#B4471D",
    "--accent-soft": "rgba(180,71,29,0.10)",
    "--neg": "#9A3015",
    "--on-dark": "#F0EBE0",
    "--on-dark-2": "#A39A88",
  },
  Carbon: {
    "--bg": "#0F0F10",
    "--bg-elev": "#181819",
    "--bg-deep": "#050505",
    "--ink": "#F2EFE8",
    "--ink-2": "#D6D3CC",
    "--ink-3": "#8B8880",
    "--ink-4": "#5E5C56",
    "--rule": "rgba(242,239,232,0.08)",
    "--rule-2": "rgba(242,239,232,0.14)",
    "--accent": "#E0A340",
    "--accent-soft": "rgba(224,163,64,0.14)",
    "--neg": "#D26B4A",
    "--on-dark": "#F2EFE8",
    "--on-dark-2": "#8B8880",
  },
};

function applyPalette(name) {
  const p = PALETTES[name] || PALETTES.Ink;
  const root = document.documentElement;
  Object.entries(p).forEach(([k, v]) => root.style.setProperty(k, v));
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "Carbon",
  "heroVariant": "dropdown",
  "density": "compact",
  "heading": "Geist"
}/*EDITMODE-END*/;

const HEADING_FONTS = {
  "Geist":              { stack: "'Geist', ui-sans-serif, system-ui, sans-serif", tracking: "-0.035em" },
  "Bricolage Grotesque":{ stack: "'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif", tracking: "-0.03em" },
  "Space Grotesk":      { stack: "'Space Grotesk', ui-sans-serif, system-ui, sans-serif", tracking: "-0.025em" },
  "Instrument Sans":    { stack: "'Instrument Sans', ui-sans-serif, system-ui, sans-serif", tracking: "-0.022em" },
  "Funnel Display":     { stack: "'Funnel Display', ui-sans-serif, system-ui, sans-serif", tracking: "-0.03em" },
};

function applyHeading(name) {
  const f = HEADING_FONTS[name] || HEADING_FONTS["Geist"];
  document.documentElement.style.setProperty("--font-display", f.stack);
  document.documentElement.style.setProperty("--display-track", f.tracking);
}

// Hash-based routing so the browser's back/forward buttons actually work.
// #analysis/TICKER -> analysis view, #article/SLUG -> article view,
// #section-id -> home view scrolled to that section, no hash -> home.
function parseRoute() {
  const h = window.location.hash.replace(/^#/, "");
  if (h.startsWith("analysis/")) return { view: "analysis", ticker: decodeURIComponent(h.slice(9)) };
  if (h.startsWith("article/")) return { view: "article", lesson: decodeURIComponent(h.slice(8)) };
  if (h.startsWith("compare/")) {
    const [ta, tb] = decodeURIComponent(h.slice(8)).split("-");
    return { view: "compare", tickerA: ta || null, tickerB: tb || null };
  }
  if (h) return { view: "home", anchor: h };
  return { view: "home" };
}

function App() {
  const initialRoute = parseRoute();
  const [view, setView] = useStateApp(initialRoute.view); // "home" | "analysis" | "article"
  const [selected, setSelected] = useStateApp(initialRoute.ticker || "PSO");
  const [selectedLesson, setSelectedLesson] = useStateApp(initialRoute.lesson || "what-is-psx");
  const [compareA, setCompareA] = useStateApp(initialRoute.tickerA || "PSO");
  const [compareB, setCompareB] = useStateApp(initialRoute.tickerB || "OGDC");
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffectApp(() => { applyPalette(tweaks.palette); }, [tweaks.palette]);
  useEffectApp(() => { applyHeading(tweaks.heading); }, [tweaks.heading]);
  useEffectApp(() => {
    document.documentElement.style.setProperty("--section-y",
      tweaks.density === "compact" ? "clamp(56px, 7vw, 96px)" : "clamp(72px, 9vw, 128px)");
  }, [tweaks.density]);

  const [pendingAnchor, setPendingAnchor] = useStateApp(initialRoute.anchor || null);

  const scrollToSection = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // Single place that both updates React state AND (optionally) pushes a
  // browser history entry. popstate (back/forward) calls this with
  // push:false so it just re-syncs state instead of creating new entries.
  const applyRoute = (route, push = true) => {
    setView(route.view);
    if (route.ticker) setSelected(route.ticker);
    if (route.lesson) setSelectedLesson(route.lesson);
    if (route.view === "compare") {
      if (route.tickerA) setCompareA(route.tickerA);
      if (route.tickerB) setCompareB(route.tickerB);
    }
    if (route.view === "home" && route.anchor) setPendingAnchor(route.anchor);

    if (push) {
      const base = window.location.pathname + window.location.search;
      const hash =
        route.view === "analysis" ? "#analysis/" + (route.ticker || selected) :
        route.view === "article"  ? "#article/" + (route.lesson || selectedLesson) :
        route.view === "compare"  ? "#compare/" + (route.tickerA || compareA) + "-" + (route.tickerB || compareB) :
        route.anchor ? "#" + route.anchor : "";
      history.pushState(null, "", base + hash);
    }
  };

  const openAnalysis = (t) => applyRoute({ view: "analysis", ticker: t || selected });
  const openArticle = (slug) => {
    applyRoute({ view: "article", lesson: slug });
    window.scrollTo(0, 0);
  };
  const openCompare = (a, b) => {
    applyRoute({ view: "compare", tickerA: a || compareA, tickerB: b || compareB });
    window.scrollTo(0, 0);
  };
  const goHome = () => applyRoute({ view: "home" });

  // Nav links must work from any view: if already home, scroll directly;
  // otherwise navigate home first and scroll once the section has mounted.
  const goToSection = (id) => {
    if (view === "home") scrollToSection(id);
    applyRoute({ view: "home", anchor: id });
  };

  useEffectApp(() => {
    const onPop = () => applyRoute(parseRoute(), false);
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  useEffectApp(() => {
    if (view === "home" && pendingAnchor) {
      const id = pendingAnchor;
      requestAnimationFrame(() => requestAnimationFrame(() => scrollToSection(id)));
      setPendingAnchor(null);
    }
  }, [view, pendingAnchor]);

  return (
    <>
      {view === "home" ? (
        <Landing
          selected={selected}
          setSelected={setSelected}
          onAnalyse={() => openAnalysis()}
          onPick={openAnalysis}
          onHome={goHome}
          onNavLink={goToSection}
          onOpenArticle={openArticle}
          onCompare={openCompare}
          heroVariant={tweaks.heroVariant}
        />
      ) : view === "article" ? (
        <Article slug={selectedLesson} onBack={goHome} onNavLink={goToSection} onCompare={openCompare} />
      ) : view === "compare" ? (
        <Compare
          tickerA={compareA}
          tickerB={compareB}
          onChangeA={(t) => openCompare(t, compareB)}
          onChangeB={(t) => openCompare(compareA, t)}
          onBack={goHome}
          onNavLink={goToSection}
          onAnalyse={() => openAnalysis()}
          onCompare={openCompare}
        />
      ) : (
        <AnalysisBoundary onBack={goHome}>
          <Analysis ticker={selected} onBack={goHome} onPick={openAnalysis} onNavLink={goToSection} onCompare={openCompare} />
        </AnalysisBoundary>
      )}

      <TweaksPanel>
        <TweakSection label="Palette" />
        <TweakSelect
          label="Theme"
          value={tweaks.palette}
          onChange={(v) => setTweak("palette", v)}
          options={[
            { value: "Ink",    label: "Ink · cream + emerald" },
            { value: "Frost",  label: "Frost · white + cobalt" },
            { value: "Paper",  label: "Paper · bone + terracotta" },
            { value: "Carbon", label: "Carbon · dark + amber" },
          ]}
        />

        <TweakSection label="Typography" />
        <TweakSelect
          label="Heading font"
          value={tweaks.heading}
          onChange={(v) => setTweak("heading", v)}
          options={[
            { value: "Geist",               label: "Geist · neutral geometric" },
            { value: "Bricolage Grotesque", label: "Bricolage · warm display" },
            { value: "Space Grotesk",       label: "Space Grotesk · technical" },
            { value: "Instrument Sans",     label: "Instrument · refined" },
            { value: "Funnel Display",      label: "Funnel · condensed editorial" },
          ]}
        />

        <TweakSection label="Layout" />
        <TweakRadio
          label="Hero selector"
          value={tweaks.heroVariant}
          onChange={(v) => setTweak("heroVariant", v)}
          options={[
            { value: "dropdown", label: "Dropdown" },
            { value: "list", label: "List" },
          ]}
        />
        <TweakRadio
          label="Density"
          value={tweaks.density}
          onChange={(v) => setTweak("density", v)}
          options={[
            { value: "comfortable", label: "Comfortable" },
            { value: "compact", label: "Compact" },
          ]}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
